name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel earlier runs for the same branch: a new push makes the old result
# irrelevant, and it saves CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        # -D warnings turns a compiler warning into a failure. This project
        # has zero dependencies and roughly 600 lines, so there is no excuse
        # for a warning to sit in the tree.
        run: cargo build --release --locked
        env:
          RUSTFLAGS: -D warnings

      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Verify the program runs
        # Cheap smoke test: it must start, resolve its paths, and print usage
        # without touching anything on disk.
        run: ./target/release/sys-snapshot --restore does-not-exist && exit 1 || true

  integration:
    name: Integration test on a real filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Build
        run: cargo build --release --locked

      - name: Three snapshots must share hard links, not duplicate data
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          BIN="$GITHUB_WORKSPACE/target/release/sys-snapshot"

          # First run has no base, so it is a full copy.
          "$BIN" >/dev/null 2>&1

          # File created now, so it lands in every snapshot taken afterwards.
          mkdir -p "$HOME/keepme"
          echo "unchanged content" > "$HOME/keepme/file.txt"

          # Two more snapshots, unchanged file in between.
          "$BIN" >/dev/null 2>&1
          "$BIN" >/dev/null 2>&1

          mapfile -t snaps < <(find "$HOME/.snapshots" -mindepth 1 -maxdepth 1 -type d | sort)
          echo "snapshots taken: ${#snaps[@]}"
          # Snapshot names are second-resolution timestamps. Three runs can
          # easily land inside two seconds, which is exactly the collision
          # this test found, so assert the runs produced distinct snapshots.
          test "${#snaps[@]}" -eq 3

          # The file exists in the last two snapshots and is unchanged between
          # them, so those two must share one inode: a link count of 2.
          # (The live file in $HOME is a separate inode and does not count.)
          latest="${snaps[-1]}"
          prev="${snaps[-2]}"
          a=$(stat -c "%i" "$prev/home/keepme/file.txt")
          b=$(stat -c "%i" "$latest/home/keepme/file.txt")
          links=$(stat -c "%h" "$latest/home/keepme/file.txt")
          echo "inode prev=$a latest=$b links=$links"

          if [ "$a" != "$b" ]; then
            echo "FAIL: unchanged file was copied again instead of hard linked"
            exit 1
          fi
          if [ "$links" -lt 2 ]; then
            echo "FAIL: expected the two snapshots to share one inode"
            exit 1
          fi

          # A snapshot must never contain the store itself.
          for s in "${snaps[@]}"; do
            if [ -e "$s/home/.snapshots" ]; then
              echo "FAIL: $s contains its own store, recursion is back"
              exit 1
            fi
          done

          echo "OK: hard links shared across snapshots, no recursion"