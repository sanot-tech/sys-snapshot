# ============================================================================
# 📦 sys-snapshot — почасовые снапшоты системы с откатом
# ----------------------------------------------------------------------------
# 🧱 Зависимостей НОЛЬ. Это сознательное решение:
#    весь функционал — это вызов rsync плюс работа с каталогами и временем.
#    Тянуть крейты ради этого значит замедлить сборку и усложнить сборку,
#    а задача элементарная. Единственное, что пришлось написать руками, —
#    перевод дней в дату (алгоритм Howard Hinnant) вместо ещё одного крейта.
#
# ⚙️ Сборка: cargo build --release
# ============================================================================

[package]
name = "sys-snapshot"
version = "0.2.0"
edition = "2021"
description = "📸 Почасовые снапшоты системы с откатом"
publish = false

# 📌 Пустой раздел зависимостей — это осознанно, см. выше.

[profile.release]
opt-level = 2          # 📌 2, а не 3: программа не считает, а жонглирует
                       #    файлами. Разница в скорости тут нулевая,
                       #    а время компиляции заметно меньше.
lto = true             # 🏎️ выкидывает мёртвый код
codegen-units = 1
strip = true           # 📦 компактный бинарь без отладочных символов